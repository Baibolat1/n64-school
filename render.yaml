# Render blueprint for the demonstration stand (docs/DEPLOY.md has the walkthrough).
#
# Two things about this file are on purpose and easy to break:
#
# * The start command runs ``alembic upgrade head`` before uvicorn. A deploy on a
#   fresh instance has an empty database -- without the migration the site comes
#   up and every page answers 500.
# * uvicorn is given ``--host 0.0.0.0 --port $PORT``. The platform assigns the
#   port and only sees the service if it binds it; the framework's own default
#   (127.0.0.1:8000) is invisible from outside and the deploy fails its health
#   check.
#
# One worker, because the rate limits and login throttles are in-process counters
# (app.services.rate_limit): a second worker would double every limit.
services:
  - type: web
    name: n64hub-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      # A fresh key per service, generated by the platform and never in the
      # repository. Changing it signs every student out (docs/DEPLOY.md).
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # The site is served over HTTPS, and only the platform knows that.
      - key: COOKIE_SECURE
        value: "true"
      # Fill the database at startup: the free instance has no persistent disk,
      # so every restart starts from an empty file (app.main._seed_demo_at_startup).
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_PATH
        value: school.db
      # Accounts for the jury. ``sync: false`` means the value is not in this
      # file and not in git: Render asks for it when the service is created.
      # Leave them unset and neither account is created.
      - key: JURY_LOGIN
        sync: false
      - key: JURY_PASSWORD
        sync: false
      - key: JURY_ADMIN_LOGIN
        sync: false
      - key: JURY_ADMIN_PASSWORD
        sync: false
      # Optional: the assistant answers from the school's tables without it, and
      # only asks a model when this is set (app.services.assistant).
      - key: ANTHROPIC_API_KEY
        sync: false
