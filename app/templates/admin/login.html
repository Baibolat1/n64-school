{% extends "base.html" %}
{% block title %}Вход для администратора{% endblock %}
{% block content %}
<section class="card">
<h1>Вход для администратора</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Логин</label>
    <input id="username" name="username" type="text"
           autocomplete="username" maxlength="{{ max_admin_username_length }}"
           value="{{ username or '' }}" required autofocus>

    <label for="password">Пароль</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password"
           maxlength="{{ max_password_length }}" required>

    <button type="submit">Войти</button>
</form>
</section>
{% endblock %}
