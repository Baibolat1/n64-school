{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<h2>По email и паролю</h2>
<form method="post" action="/login/email" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email"
           value="{{ email or '' }}" required>

    <label for="password">Пароль</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">Войти</button>
</form>

<h2>По коду приглашения</h2>
<p>Введите код приглашения, который выдал администратор.</p>
<form method="post" action="/login" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="code">Код приглашения</label>
    <input id="code" name="code" type="text" placeholder="XXXX-XXXX-XXXX"
           autocomplete="off" autocapitalize="characters" spellcheck="false"
           value="{{ code or '' }}" required>

    <button type="submit">Войти по коду</button>
</form>

<p class="hint">Нет аккаунта? <a href="/register">Зарегистрироваться</a>.</p>
{% endblock %}
